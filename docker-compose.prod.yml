version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: guardianiq_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guardianiq}
      POSTGRES_USER: ${POSTGRES_USER:-guardianiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guardianiq_user} -d ${POSTGRES_DB:-guardianiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - guardianiq_prod_net

  redis:
    image: redis:7-alpine
    container_name: guardianiq_redis_prod
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - guardianiq_prod_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guardianiq_backend_prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guardianiq_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-guardianiq}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      SCHEDULER_ENABLED: "true"
      PHASE2_SCHEDULER_ENABLED: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - guardianiq_prod_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guardianiq_worker_prod
    restart: always
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=INFO", "-c", "4"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guardianiq_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-guardianiq}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in production}
      SCHEDULER_ENABLED: "true"
      AUTO_MIGRATE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - guardianiq_prod_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: guardianiq_frontend_prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - guardianiq_prod_net

volumes:
  pgdata_prod:
    driver: local
  redisdata_prod:
    driver: local

networks:
  guardianiq_prod_net:
    driver: bridge
